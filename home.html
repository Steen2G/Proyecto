<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuera de Órbita — Café</title>

<link rel="stylesheet" href="CSS/home.css">
<link rel="stylesheet" href="CSS/carrito_flotante.css">

<script src="scripts/components.js"></script>

</head>

<header>

  <div id="header"></div>

</header>

<body>

<div class="wrap">

  <!-- HERO -->
  <section class="hero">
    <div class="hero-copy">
      <h1>Tu próximo viaje<br>comienza con un café</h1>
      <p>Café, bebidas frías y momentos fuera de órbita.</p>

      <a href="#menu" class="btn">VER MENÚ →</a>
    </div>

    <img src="https://i.ibb.co/DXp7RbH/Gemini-Generated-Image-hgbqp2hgbqp2hgbq.jpg" weight = 300 height="550">

  </section>

  <!-- CATEGORY NAV -->
  <nav class="nav" id="menu">
    <a href="#" class="cat1"><span class="icon">☕</span> Bebidas Calientes</a>
    <a href="#" class="cat2"><span class="icon">🥤</span> Bebidas Frías</a>
    <a href="#" class="cat3"><span class="icon">🥐</span> Alimentos</a>

  <div class="promo-title">Promoción / Producto Destacado</div>
  <section class="promo">
    <div class="promo-copy">"Descubre tu próxima<br>bebida fuera de órbita"</div>

    <div class="promo-product">

      </div>
      <div class="jar">
        <div class="label">Órbita<br>Premium<br>Coffee</div>
      </div>
    </div>

    <div class="promo-price">
      <div class="price">$6.<sup>50</sup></div>

    </div>
  </section>

</div>

<a href="carrito.html" class="floating-cart" id="floating-cart" aria-label="Ver carrito">
